<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GizVFX</title>
<style>
:root{--bg:#13151b;--panel:#1a1d25;--panel2:#20242e;--line:#2b303c;--edge:#6a7490;--text:#e7e9ef;--mut:#9aa2b5;--accent:#8fb0ff;--accent2:#222c4d;--accentline:#3d4f86;--ink:#0d1630;--ok:#7bd88f;--bad:#ff7b7b;--warn:#f2cc60;--r:7px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--edge);border-radius:var(--r);padding:5px 10px;cursor:pointer;min-height:32px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover:not(:disabled){border-color:var(--edge)}
button.icon{flex:none;padding:0;width:34px;height:34px;display:inline-grid;place-items:center}
button.icon svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button.chip{padding:3px 10px;border-radius:99px;min-height:32px}
input,select,textarea{background:#12141a;border:1px solid var(--edge);border-radius:6px;padding:5px 7px;min-width:0;min-height:32px}
input::placeholder{color:var(--mut);opacity:1}
input[type=checkbox]{accent-color:var(--accent);width:28px;height:28px;min-height:0}
input[type=range]{accent-color:var(--accent);padding:0;border:0;background:transparent}
label{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:18px;margin:0 6px 0 0;letter-spacing:.3px}
header h1 span{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed=true]{background:var(--accent2);color:var(--accent)}
.sp{flex:1}
.grp{display:inline-flex;gap:6px;align-items:center}
#viewSeg,#bViewT{display:none}
#modeNote{font-size:12px;color:var(--mut)}
.seg button[aria-disabled=true]{opacity:.85;color:var(--mut);cursor:default}
main{display:grid;grid-template-columns:250px minmax(0,1fr) 400px;min-height:0}
aside,section{min-height:0;overflow:auto}
#list{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
#list .top{padding:8px;display:grid;gap:6px;position:sticky;top:0;background:var(--panel);z-index:1}
#list .top .row2{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12px}
#items{overflow:auto;padding:0 6px 12px;outline:0}
.cat{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin:12px 6px 4px}
.item{display:block;border:1px solid transparent;padding:5px 8px;border-radius:6px;cursor:pointer}
.item:hover{background:var(--panel2)}
.item[aria-selected=true]{background:var(--accent2);border-color:var(--accentline)}
.item small{color:var(--mut);display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item[aria-selected=true] small,.item[aria-selected=true] .tag{color:#c3cadb}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--mut);margin-left:4px}
.empty{padding:18px 10px;color:var(--mut)}
#stagewrap{display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#1b1d24;box-shadow:inset 0 0 0 1px var(--line)}
#cvwrap{position:absolute;inset:0;overflow:auto;display:flex}
#cvbox{position:relative;margin:auto;flex:none}
#pv{position:absolute;inset:0;pointer-events:none}
#pv i{position:absolute;background:var(--accent);opacity:.55}
#pv .h{left:0;right:0;height:1px}#pv .v{top:0;bottom:0;width:1px}
#dim{position:absolute;bottom:8px;right:12px;font-size:12px;color:var(--mut);background:#12141acc;padding:1px 8px;border-radius:99px;pointer-events:none}
#stage.checker{background:conic-gradient(#363b4a 25%,#262a35 0 50%,#363b4a 0 75%,#262a35 0) 0 0/24px 24px}
#cv{image-rendering:pixelated;max-width:none;display:block}
#cv.smooth{image-rendering:auto}
#cv.stale,#strip.stale{opacity:.35;transition:opacity .15s}
#stalenote{position:absolute;top:10px;left:12px;font-size:13px;background:#12141acc;padding:3px 9px;border-radius:99px;max-width:60%}
#busy{position:absolute;top:10px;right:12px;display:flex;gap:7px;align-items:center;font-size:13px;opacity:0;transition:opacity .15s;background:#12141acc;padding:3px 9px;border-radius:99px}
#busy.on{opacity:1}
#err{position:absolute;left:12px;right:12px;bottom:10px;background:#3a1618;border:1px solid #7a2b30;color:#ffd5d5;border-radius:var(--r);padding:8px 10px;display:none;max-height:40%;overflow:auto}
#err small{display:block;color:#ffb4b4;opacity:.85;margin-top:3px;word-break:break-word}
#bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
#bar input[type=range]{flex:1;min-height:32px;height:32px}
#bPlay{min-width:64px}
#fc{min-width:64px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
#strip{display:flex;gap:4px;padding:6px 12px;overflow-x:auto;border-top:1px solid var(--line);background:var(--panel);min-height:78px}
#strip canvas{height:64px;flex:none;border:1px solid var(--line);border-radius:4px;cursor:pointer;background:#1b1d24;image-rendering:pixelated}
#strip canvas.on{border-color:var(--accent)}
#editor{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
#foot{border-top:1px solid var(--line);background:var(--panel);padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#foot input{flex:1;min-width:90px}
#lookNote{font-size:12px;color:var(--mut);flex-basis:100%}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--ink);padding:6px 10px;border-radius:var(--r);z-index:30}
.skip:focus{top:8px}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;border-bottom:2px solid transparent;padding:9px 4px;color:var(--mut);min-height:38px}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 5px;margin-left:5px;border-radius:99px;font-size:12px;text-align:center;background:#2f3442;color:var(--text)}
.badge.ok{background:#1d3a28;color:#aef0bd}.badge.bad{background:#4a1d20;color:#ffc4c4}.badge.warn{background:#463d17;color:#f7de8a}
.pane{padding:14px 16px;overflow:auto;display:none}
.pane.on{display:block;flex:1 1 auto;min-height:0}
.grid2{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;align-items:center}
.row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:16px 0 6px;font-weight:600}
h2:first-child{margin-top:0}
details.help{border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;margin-bottom:10px;background:var(--panel2)}
details.help summary,.keys summary,.msg summary{cursor:pointer;color:var(--accent);padding:5px 0}
.keys summary{display:list-item;min-height:32px}
details.help p{margin:6px 0;color:var(--mut)}
.card{border:1px solid var(--line);border-radius:var(--r);margin:8px 0;background:var(--panel2)}
.card.sel{border-color:var(--accentline)}
.card .hd{display:flex;gap:4px;align-items:center;padding:3px 6px 3px 3px}
.card .hd .title{flex:1;min-width:0;text-align:left;display:flex;gap:8px;border:0;background:transparent;overflow:hidden}
.card .hd .title b{font-weight:600;flex:none}
.card .hd .title .s{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card textarea{display:block;width:calc(100% - 16px);margin:0 8px 6px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical;min-height:70px;white-space:pre-wrap}
.card textarea[aria-invalid=true],#json[aria-invalid=true]{border-color:var(--bad)}
.fmsg{margin:0 8px 8px;color:#ffb4b4;font-size:12px}
#tl{border-top:1px solid var(--line);background:var(--panel);padding:6px 12px;max-height:min(260px,34vh);overflow:auto;position:relative}
#tl[hidden]{display:none}
.tlrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;height:24px}
.tlrow .nm{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;border:0;background:transparent;padding:0;min-height:0;height:22px;cursor:pointer}
.tlrow.sel .nm{color:var(--accent)}
.tlrow .tr{position:relative;height:14px;background:#12141a;border-radius:4px;touch-action:none}
.tlrow .bar{position:absolute;top:1px;bottom:1px;background:var(--accentline);border:1px solid var(--accent);border-radius:3px;cursor:grab;min-width:4px}
.tlrow.sel .bar{background:var(--accent2)}
.tlrow .bar.hold{background-image:repeating-linear-gradient(45deg,transparent 0 4px,#ffffff2a 4px 8px)}
.tlrow .bar i{position:absolute;top:-2px;bottom:-2px;width:8px;cursor:ew-resize}
.tlrow .bar i.l{left:-4px}.tlrow .bar i.r{right:-4px}
#tl .ph{position:absolute;top:6px;bottom:6px;left:116px;right:12px;pointer-events:none}
#tl .ph b{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--bad);opacity:.85}
#mkl{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:1px solid var(--accent);background:#12141acc;color:var(--text);font-size:11px;display:grid;place-items:center;pointer-events:auto;cursor:grab;touch-action:none}
.mk.sel{background:var(--accent);color:var(--ink)}
.msg .lk{margin:4px 4px 0 0}
.rows{padding:6px 10px 0}
.krow{display:grid;grid-template-columns:84px minmax(0,1fr) 34px;gap:6px;align-items:center;margin:4px 0}
.krow>label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cc .sub{color:var(--mut);font-size:12px}
.cc input[type=range]{flex:1;min-width:70px}
.cc select{flex:1;min-width:0}
.cc input[type=color]{padding:0;width:34px}
.krow.bad input,.krow.bad select{border-color:var(--bad)}
.mono{font:12px ui-monospace,Consolas,monospace}
.card.rerr{border-color:#7a2b30}
.addrow{padding:0 10px 6px}.addrow .cc{flex-wrap:nowrap}.addrow select{flex:1;min-width:0}
details.rawjson{margin:2px 8px 8px}
details.rawjson summary{cursor:pointer;color:var(--accent);min-height:32px;display:list-item;padding:5px 0}
details.rawjson textarea{width:100%;margin:0}
.keys{margin:0 8px 8px;font-size:12px;color:var(--mut)}
.keys button.key{padding:0 8px;min-height:32px;min-width:32px;color:var(--accent);border-color:transparent;background:transparent;font:12px ui-monospace,Consolas,monospace}
.keys button.key:hover{border-color:var(--edge)}
.keys p{margin:2px 0}
#json{width:100%;height:calc(100vh - 230px);min-height:200px;font:12px/1.4 ui-monospace,Consolas,monospace;white-space:pre;resize:none}
.msg{margin:6px 0;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2)}
.msg.bad{border-color:#7a2b30;background:#2a1517}.msg.ok{border-color:#2c5a38;background:#14231a}.msg.warn{border-color:#6a5a22;background:#262211}
.msg small{display:block;color:var(--mut);margin-top:2px;word-break:break-word}
.msg button{margin-top:4px}
.hint{color:var(--mut);font-size:12px;margin:4px 0}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--edge);border-radius:var(--r);padding:6px 8px 6px 12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;z-index:9;display:flex;gap:10px;align-items:center}
#toast.on{opacity:1;pointer-events:auto}
.sw{width:32px;height:32px;border-radius:6px;padding:0}
.sw[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px}
@media(max-width:1100px){main{grid-template-columns:200px minmax(0,1fr) 340px}}
@media(max-width:820px){
  #app{height:100dvh}
  header{padding:6px 10px;gap:6px}
  #viewSeg,#bViewT{display:inline-flex}
  #viewGrp{display:none;flex-basis:100%}
  #viewGrp.open{display:inline-flex;flex-wrap:wrap}
  .sp{display:none}
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
  #stagewrap{grid-row:1;grid-column:1;height:36vh;border-bottom:1px solid var(--line)}
  #list,#editor{grid-row:2;grid-column:1;border:0}
  #strip{display:none}
  #tl{display:none}
  main[data-view=list] #editor,main[data-view=edit] #list{display:none}
  #json{height:50vh}
}
@media(pointer:coarse),(max-width:820px){button,button.chip,.keys button.key,input,select,textarea,.tabs button,.keys summary,details.help summary{min-height:44px}.keys button.key{min-width:44px}button.icon,.sw{width:44px;height:44px}input[type=checkbox]{width:32px;height:32px;min-height:0}#bar input[type=range]{min-height:44px}.card .hd .title{flex-direction:column;gap:0}.card .hd .title .s{white-space:normal;max-height:2.9em}}
@media(prefers-reduced-motion:reduce){#busy,#toast{transition:none}}
</style>
</head>
<body>
<a class="skip" id="skip" href="#editor">Skip to the editor</a>
<div id="app">
<header>
  <h1><span>Giz</span>VFX</h1>
  <div class="seg" id="modeSeg" role="group" aria-label="Look"><button data-m="pixel" aria-pressed="true">Pixel</button><button data-m="painted" aria-pressed="false">Painted</button></div>
  <span id="modeNote" hidden>Painted needs a recipe: this effect is drawn by Python.</span>
  <select id="style" aria-label="Painted style" hidden></select>
  <select id="quality" aria-label="Painted quality" hidden><option value="2">draft 2x</option><option value="3" selected>3x</option><option value="4">final 4x</option></select>
  <div class="seg" id="viewSeg" role="group" aria-label="Show"><button data-v="list" aria-pressed="false">Effects</button><button data-v="edit" aria-pressed="true">Edit</button></div>
  <span class="sp"></span>
  <button id="bViewT" class="chip" aria-expanded="false" aria-controls="viewGrp" title="Ground, pivot and zoom">View</button>
  <span class="grp" id="viewGrp"><span class="grp" id="grounds" role="group" aria-label="Ground behind the effect"></span><button id="bPv" class="chip" aria-pressed="true" title="Show the pivot (the point the effect stands on), the ground line and a handle for each layer">Guides</button>
  <label class="grp">zoom <select id="zoom"><option value="0">fit</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option><option value="6">6x</option><option value="8">8x</option></select></label></span>
  <span class="grp"><button id="bUndo" class="icon" aria-label="Undo (Ctrl+Z)" title="Undo (Ctrl+Z)" disabled></button>
  <button id="bRedo" class="icon" aria-label="Redo (Ctrl+Shift+Z)" title="Redo (Ctrl+Shift+Z)" disabled></button></span>
  <span class="grp"><button id="bNew" class="primary" title="Start a new effect from a glow and a ring">New effect</button><button id="bOpen">Open file</button></span><input type="file" id="file" accept=".json,application/json" hidden>
</header>
<main data-view="edit">
  <aside id="list" aria-label="Effects">
    <div class="top">
      <input id="q" type="search" placeholder="Search effects" aria-label="Search effects">
      <div class="row2"><label><input type="checkbox" id="onlyRecipes"> Editable only</label><span id="count" aria-live="polite"></span></div>
    </div>
    <div id="items" role="listbox" aria-label="Effects"></div>
  </aside>
  <section id="stagewrap" aria-label="Preview">
    <div id="stage"><div id="cvwrap"><div id="cvbox"><canvas id="cv" width="96" height="96" role="img" aria-label="Effect preview"></canvas><div id="pv" aria-hidden="true"><i class="h"></i><i class="v"></i></div><div id="mkl"></div></div></div><div id="dim" aria-hidden="true"></div><div id="stalenote" role="status" hidden>Showing the last version that could be drawn</div><div id="busy" role="status">Drawing&hellip;</div><div id="err" role="alert"></div></div>
    <div id="bar">
      <button id="bPlay" title="Play or pause (Space)">Pause</button>
      <button id="bPrev" class="icon" aria-label="Previous frame (Left arrow)" title="Previous frame"></button>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Frame">
      <button id="bNext" class="icon" aria-label="Next frame (Right arrow)" title="Next frame"></button>
      <span id="fc">0 / 0</span>
      <span id="kind" class="tag"></span>
    </div>
    <div id="rmnote" class="hint" role="status" hidden style="padding:0 12px">Paused because your system prefers reduced motion. Press Play to watch.</div>
    <div id="tl" aria-label="Layer timing" hidden></div>
    <div id="strip" aria-hidden="true" tabindex="-1"></div>
  </section>
  <aside id="editor" aria-label="Editor">
    <div class="tabs" role="tablist" aria-label="Editor sections">
      <button role="tab" id="tab-effect" aria-controls="p-effect" data-t="effect" aria-selected="true">Effect</button>
      <button role="tab" id="tab-layers" aria-controls="p-layers" data-t="layers" aria-selected="false" tabindex="-1">Layers</button>
      <button role="tab" id="tab-json" aria-controls="p-json" data-t="json" aria-selected="false" tabindex="-1">JSON</button>
      <button role="tab" id="tab-check" aria-controls="p-check" data-t="check" aria-selected="false" tabindex="-1">Check<span class="badge" id="badge" aria-hidden="true">&hellip;</span><span class="sr" id="badgeSr">Check result: not run</span></button>
    </div>
    <div class="pane on" id="p-effect" role="tabpanel" aria-labelledby="tab-effect"></div>
    <div class="pane" id="p-layers" role="tabpanel" aria-labelledby="tab-layers"></div>
    <div class="pane" id="p-json" role="tabpanel" aria-labelledby="tab-json"><textarea id="json" spellcheck="false" aria-label="Recipe JSON" aria-describedby="jsonmsg"></textarea><div id="jsonmsg" class="fmsg" role="alert" hidden></div><div class="row"><button id="bFmt">Format</button><button id="bDl">Download JSON</button></div></div>
    <div class="pane" id="p-check" role="tabpanel" aria-labelledby="tab-check"></div>
    <div id="foot"><label for="saveName" class="sr">File name</label><input id="saveName" placeholder="file name"><button id="bSave">Save recipe</button><button id="bExport" class="primary" title="Export (Ctrl+Enter)">Export GIF + sheet</button><span id="lookNote"></span></div>
  </aside>
</main>
</div>
<div id="toast" role="status"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='value'||k==='checked'||k==='disabled'||k==='hidden')e[k]=v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));return e}
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-GizVFX':'1'},body:JSON.stringify(body)});return r.json()}
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
let uidN=0;const uid=p=>p+(++uidN);
const IC={up:'<path d="M3 9l4-4 4 4"/>',down:'<path d="M3 5l4 4 4-4"/>',dup:'<rect x="5" y="5" width="7" height="7" rx="1.2"/><path d="M9 3H3.5A.5.5 0 003 3.5V9"/>',del:'<path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/>',prev:'<path d="M9 3L5 7l4 4"/>',next:'<path d="M5 3l4 4-4 4"/>',undo:'<path d="M5 3.5L2.5 6 5 8.5"/><path d="M3 6h5a3 3 0 010 6H6"/>',redo:'<path d="M9 3.5L11.5 6 9 8.5"/><path d="M11 6H6a3 3 0 000 6h2"/>'};
const icon=n=>h('span',{html:'<svg viewBox="0 0 14 14" aria-hidden="true">'+IC[n]+'</svg>'}).firstChild;
function setIcon(btn,n){btn.replaceChildren(icon(n))}
function toast(t,act){const e=$('#toast');e.replaceChildren(t);if(act)e.append(h('button',{onclick:()=>{act.fn();e.classList.remove('on')}},act.label));e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>{e.classList.remove('on');toast.c=setTimeout(()=>{if(!e.classList.contains('on'))e.replaceChildren()},300)},act?7000:3500);clearTimeout(toast.c)}

function syncJson(){const j=$('#json');if(document.activeElement===j)return;const off=!S.recipe;j.disabled=off;$('#bFmt').disabled=$('#bDl').disabled=off;if(off){j.value='';j.placeholder='This effect is drawn by Python code, so there is no recipe to edit. Press New effect to make one.';j.removeAttribute('aria-invalid');$('#jsonmsg').hidden=true;return}j.placeholder='';j.value=JSON.stringify(S.recipe,null,1);j.removeAttribute('aria-invalid');$('#jsonmsg').hidden=true}
function shapeErr(v){if(!v||typeof v!=='object'||Array.isArray(v))return'a recipe is an object like { "layers": [ ... ] }';if(!Array.isArray(v.layers))return'a recipe needs a "layers" list, for example "layers": [ { "type": "glow" } ]';if(!v.layers.length)return'a recipe needs at least one layer';if(v.layers.some(l=>!l||typeof l!=='object'||Array.isArray(l)))return'every layer must be an object like { "type": "glow" }';return null}
$('#json').oninput=e=>{const m=$('#jsonmsg');let v;try{v=JSON.parse(e.target.value)}catch(x){e.target.setAttribute('aria-invalid','true');if(S.renderErr)showErr(null);m.hidden=false;m.textContent='Not valid JSON yet ('+String(x.message).replace(/^JSON\.parse: /,'')+'). The preview keeps the last good version; your text stays as you typed it.';return}
  const se=shapeErr(v);if(se){e.target.setAttribute('aria-invalid','true');m.hidden=false;if(S.renderErr)showErr(null);m.textContent='This is JSON, but not a recipe yet: '+se+'. The recipe and the preview stay as they were.';return}
  try{S.recipe=v;S.code=false;e.target.removeAttribute('aria-invalid');m.hidden=true;renderEffect();renderLayers();edit('json','edit JSON')}catch(x){m.hidden=false;m.textContent=String(x.message)}};
$('#json').onblur=()=>{if(!$('#json').getAttribute('aria-invalid'))syncJson()};
$('#bFmt').onclick=()=>{if(S.recipe&&!$('#json').getAttribute('aria-invalid')){$('#json').blur();syncJson()}};
$('#bDl').onclick=()=>{if(!S.recipe)return;download((S.recipe.id||'effect').split('/').pop()+'.json',new Blob([JSON.stringify(S.recipe,null,1)],{type:'application/json'}))};
function download(name,blob){const a=h('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove()}
function updFoot(){const r=S.recipe;$('#bSave').disabled=!r;const n=$('#saveName');n.disabled=!r;n.value=r?(r.id||'effect').split('/').pop():''}
function updLook(){$('#lookNote').textContent='Exports the current look: '+S.mode+(S.mode==='painted'?' '+S.style:'')}
$('#bSave').onclick=()=>save();$('#bExport').onclick=()=>exportFx();
async function save(){if(!S.recipe)return;const r=await api('/api/save',{name:$('#saveName').value||(S.recipe.id||'effect').split('/').pop(),recipe:S.recipe});if(r.error){toast(r.error);return}S.saved=snap();S.dirty=false;setTitle();toast('Saved to '+r.path)}
async function exportFx(){toast('Exporting...');const r=await api('/api/export',payload({name:S.recipe?($('#saveName')?.value||''):''}));if(r.error){toast(friendly(r.error).text);return}
  for(const[n,b64]of Object.entries(r.files)){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);download(n,new Blob([u]))}toast('Exported. A copy is also in '+r.folder)}

// ---------- check and fix
function setBadge(cls,n){const b=$('#badge');b.className='badge '+cls;b.textContent=cls==='ok'?'ok':n==null?'...':cls==='warn'?'\u2022':String(n);$('#badgeSr').textContent='Check result: '+(cls==='ok'?'clean':cls==='bad'?n+' problem(s)':cls==='warn'?n+' note(s)':'running')}
function scheduleCheck(){clearTimeout(tC);S.check=null;setBadge('',null);tC=setTimeout(runCheck,500)}
async function runCheck(){if(S.renderErr)return;const my=seq;const r=await api('/api/check',payload());if(my!==seq)return;S.check=r;if(r.error)setBadge('bad',1);else setBadge(r.problems.length?'bad':r.flags.length?'warn':'ok',r.problems.length||r.flags.length);renderCheck()}
function msg(cls,text,raw,quiet){const ids=[...new Set([...String(text).matchAll(/\blayer (\d+) \w+/g)].map(m=>+m[1]-1))].filter(i=>S.recipe&&S.recipe.layers[i]);
  return h('div',{class:'msg '+cls,role:cls==='bad'&&!quiet?'alert':null},text,raw&&raw!==text?rawDetails(raw):null,...ids.map(i=>h('button',{class:'lk chip',onclick:()=>goLayer(i)},'Go to layer '+(i+1))))}
function renderCheck(){
  const p=$('#p-check');p.replaceChildren();const c=S.check;
  const need=c&&!c.error&&!S.renderErr&&(c.problems.length||c.flags.length);
  p.append(h('div',{class:'row'},h('button',{onclick:runCheck},'Check again'),h('button',{class:need?'primary':'',disabled:!!S.renderErr,title:S.renderErr?'Correct the drawing error first':'Check and repair; the recipe changes only when you press Use',onclick:runFix},'Fix'),h('span',{class:'hint'},'Fix repairs what can be repaired and shows what is left. Your recipe changes only if you press Use.')));
  if(S.renderErr){const f=S.renderErr,d=msg('bad','The effect cannot be drawn. '+f.text,f.raw,true);if(f.layer!=null&&S.recipe)d.append(h('button',{onclick:()=>goLayer(f.layer)},'Go to layer '+(f.layer+1)));p.append(d)}
  else if(!c)p.append(h('div',{class:'hint'},'Checking...'));
  else if(c.error){const fe=friendly(c.error);p.append(msg('bad',fe.text,fe.raw))}
  else{if(!c.problems.length&&!c.flags.length)p.append(msg('ok','Clean: deterministic, '+(S.loop?'the loop closes':'ends empty')+', nothing touches the edge.'));else if(!c.problems.length)p.append(msg('ok','No blocking problems. '+c.flags.length+' note'+(c.flags.length>1?'s':'')+' below for you to judge.'));
    c.problems.forEach(x=>p.append(msg('bad',x)));c.flags.forEach(x=>p.append(msg('warn',x)))}
  const f=S.fixed;if(f){p.append(h('h2',{},'Fix result'));if(f.blocked)p.append(msg('warn','Fix cannot repair an effect that cannot be drawn. Correct the error above first (the button takes you to the layer), then press Fix again.'));else if(f.error){const fe=friendly(f.error);p.append(msg('bad',fe.text,fe.raw))}else{
    (f.done.length?f.done:['Nothing a machine can repair here; the notes above are for you to judge.']).forEach(x=>p.append(msg('ok',x)));f.problems.forEach(x=>p.append(msg('bad','Still to fix by hand: '+x)));f.notes.forEach(x=>p.append(msg('',x)));
    if(f.fixed_recipe)p.append(h('div',{class:'row'},h('button',{class:'primary',onclick:()=>{replaceWith({recipe:f.fixed_recipe,options:S.options,openedId:S.openedId},'Fixed recipe in use (canvas resized)')}},f.problems.length?'Use the fixed recipe ('+f.problems.length+' left)':'Use the fixed recipe'),h('span',{class:'hint'},'The canvas size changes; Undo brings the old one back.')))}}}
async function runFix(){S.fixed=null;if(S.renderErr){S.fixed={blocked:true};tab('check');renderCheck();return}const r=await api('/api/fix',payload());S.fixed=r;tab('check');renderCheck()}

addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});
$('#skip').onclick=e=>{e.preventDefault();document.querySelector('.tabs [aria-selected=true]').focus()};
// ---------- start
(async()=>{
  S.meta=await api('/api/meta');$('#style').append(...S.meta.styles.map(s=>h('option',{value:s},s)));
  S.effects=(await api('/api/list')).effects;setGround(S.ground);setPv(pvOn);setBadge('',null);tab('layers');updHist();updFoot();updLook();
  const first=['buff/level-up','holy/smite'].map(id=>S.effects.find(e=>e.id===id&&e.recipe)).find(Boolean)||S.effects.find(e=>e.recipe)||S.effects[0];if(first)await openEffect(first.id);
  buildList()})();
</script>
